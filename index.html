<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PoseGuide — Pinterest Poz Rehberi</title>
  <meta name="description" content="PoseGuide ile mükemmel fotoğraf pozunu bul! Pinterest estetiğinde poz filtreleme, kamera üzerinde silüet rehberi." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>" />
  <link rel="stylesheet" href="./frontend/src/styles/index.css" />
  <style>
    @keyframes ripple { to { transform: scale(3); opacity: 0; } }
    @media (max-width: 768px) {
      .hero-grid { grid-template-columns: 1fr !important; }
      .cam-grid  { grid-template-columns: 1fr !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    // ── Inline bootstrap: path'leri frontend/ prefix'i ile yükle ──
    // Bu dosya projenin kök dizininden çift tıklayarak açılabilir.

    import { GirisEkrani }       from './frontend/src/pages/GirisEkrani.js';
    import { FiltrelemeSayfasi } from './frontend/src/pages/FiltrelemeSayfasi.js';
    import { KameraRehberi }     from './frontend/src/pages/KameraRehberi.js';
    import { Galeri }            from './frontend/src/pages/Galeri.js';

    const AppState = { currentPage: 'giris', activePose: null, pages: {} };

    function showToast(msg, type = 'success') {
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2800);
    }

    async function navigateTo(pageId) {
      const current = AppState.pages[AppState.currentPage];
      if (current) { current.classList.remove('active'); current.dispatchEvent(new CustomEvent('pageLeave')); }

      const container = document.getElementById('page-container');

      if (AppState.pages[pageId]) {
        AppState.pages[pageId].classList.add('active');
        AppState.currentPage = pageId;
        updateNav(pageId);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      const loader = document.createElement('div');
      loader.style.cssText = 'position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#E60023,#3B82F6,#22C55E);z-index:9999;animation:shimmer 1s linear infinite;background-size:200% 100%;';
      document.body.appendChild(loader);

      const setActivePose = (pose) => {
        AppState.activePose = pose;
        if (AppState.pages['kamera']) { AppState.pages['kamera'].remove(); delete AppState.pages['kamera']; }
        showToast(`✅ "${pose.title}" seçildi!`);
        navigateTo('kamera');
      };

      const builders = {
        giris:    () => GirisEkrani({ navigateTo }),
        filtrele: () => FiltrelemeSayfasi({ navigateTo, setActivePose }),
        kamera:   () => KameraRehberi({ navigateTo, activePose: AppState.activePose }),
        galeri:   () => Galeri({ navigateTo, setActivePose }),
      };

      try {
        const pageEl = await builders[pageId]?.();
        if (!pageEl) { loader.remove(); return; }
        pageEl.classList.add('active');
        container.appendChild(pageEl);
        AppState.pages[pageId] = pageEl;
        AppState.currentPage = pageId;
        updateNav(pageId);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        console.error(err);
        showToast('Sayfa yüklenemedi.', 'error');
      } finally {
        loader.remove();
      }
    }

    function updateNav(pageId) {
      document.querySelectorAll('.nav-link').forEach(b => {
        b.style.borderColor = b.dataset.page === pageId ? 'var(--pinterest-red)' : '';
        b.style.color = b.dataset.page === pageId ? 'var(--pinterest-red)' : '';
      });
    }

    // ── Navbar ──
    const nav = document.createElement('nav');
    nav.className = 'navbar';
    nav.innerHTML = `
      <div id="logo-click" class="navbar-logo" style="cursor:pointer;">
        <svg width="26" height="26" viewBox="0 0 28 28" fill="none" style="flex-shrink:0;">
          <rect width="28" height="28" rx="8" fill="#E60023"/>
          <path d="M14 6C10.13 6 7 9.13 7 13c0 2.7 1.54 5.05 3.8 6.25-.05-.48-.1-1.22.02-1.74l.74-3.14s-.19-.38-.19-.94c0-.88.51-1.54 1.15-1.54.54 0 .8.41.8.9 0 .55-.35 1.37-.53 2.13-.15.64.32 1.16.94 1.16 1.13 0 1.89-1.19 1.89-2.91 0-1.52-1.09-2.58-2.65-2.58-1.81 0-2.87 1.36-2.87 2.76 0 .55.21 1.13.47 1.45.05.06.06.12.04.18l-.18.72c-.03.1-.1.13-.18.09-.83-.39-1.35-1.6-1.35-2.58 0-2.1 1.52-4.02 4.39-4.02 2.3 0 4.09 1.64 4.09 3.83 0 2.28-1.44 4.12-3.43 4.12-.67 0-1.3-.35-1.52-.76l-.41 1.54c-.15.57-.55 1.29-.82 1.73.62.19 1.27.29 1.95.29 3.87 0 7-3.13 7-7s-3.13-7-7-7z" fill="white"/>
        </svg>
        PoseGuide
      </div>
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        <button class="btn btn-secondary btn-sm nav-link" data-page="giris">🏠 Ana Sayfa</button>
        <button class="btn btn-secondary btn-sm nav-link" data-page="filtrele">⚡ Filtrele</button>
        <button class="btn btn-secondary btn-sm nav-link" data-page="galeri">🖼️ Galeri</button>
        <button class="btn btn-primary btn-sm nav-link" data-page="filtrele">📸 Poz Bul</button>
      </div>
    `;
    nav.querySelector('#logo-click').addEventListener('click', () => navigateTo('giris'));
    nav.querySelectorAll('.nav-link').forEach(b => b.addEventListener('click', () => navigateTo(b.dataset.page)));
    document.getElementById('root').appendChild(nav);

    // ── Page container ──
    const container = document.createElement('div');
    container.id = 'page-container';
    container.className = 'app-container';
    document.getElementById('root').appendChild(container);

    // ── Başlat ──
    navigateTo('giris');
  </script>
</body>
</html>
